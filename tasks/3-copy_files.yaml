- name: Install containerd nerdctl binaries to the target path
  ansible.builtin.copy:
    src: "{{ temporary_folder }}/nerdctl/bin/"
    dest: "/opt/nerdctl/bin/"
    mode: "0550"
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"
    remote_src: true

- name: Create temporary directory for containerd nerdctl installation
  ansible.builtin.file:
    path: "/opt/nerdctl/bin/"
    state: directory
    mode: "0755"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"

- name: Create a symbolic link
  ansible.builtin.file:
    src: "/opt/nerdctl/bin/nerdctl"
    dest: "{{ install_path }}/nerdctl"
    state: link

- name: Create directory for the crictl binary
  ansible.builtin.file:
    path: "/opt/crictl/bin/"
    state: directory
    mode: "0755"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"

- name: Install the crictl binary
  ansible.builtin.copy:
    src: "{{ temporary_folder }}/crictl/crictl"
    dest: "/opt/crictl/bin/crictl"
    mode: "0550"
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"
    remote_src: true

- name: Create a symbolic link to crictl
  ansible.builtin.file:
    src: "/opt/crictl/bin/crictl"
    dest: "{{ install_path }}/crictl"
    state: link
